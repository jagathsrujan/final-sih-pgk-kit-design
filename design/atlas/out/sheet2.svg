  <text x="22" y="22" font-size="20" text-anchor="start" style="fill:var(--f-ink, #10151b)">Mechanical architecture — the three bodies</text>
  <text x="22" y="42.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">Every solid in the P4 build, with the mass measured off it. Masses are what the model weighs, never yet what the kit will weigh (T4/T5/T9/T10 are unruled).</text>
  <text x="24" y="87.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">BODY SIDE</text>
  <text x="24" y="103.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">turns with the shell</text>
  <text x="184" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A1 Kit body</text>
  <text x="184" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">696 g · the spigot in the well</text>
  <text x="457.6" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A2 Stator core</text>
  <text x="457.6" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">296 g · 12 slots, SMC</text>
  <text x="731.2" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A3 Windings</text>
  <text x="731.2" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">365 g · copper, 12 coils</text>
  <text x="1004.8" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A10 Front hub</text>
  <text x="1004.8" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">433 g · radome + aperture</text>
  <text x="1278.4" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A11 Retention collar</text>
  <text x="1278.4" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">138 g · takes the setback</text>
  <text x="24" y="171.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">BODY SIDE</text>
  <text x="24" y="187.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">electronics and fuze</text>
  <text x="184" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A4 Inner races</text>
  <text x="184" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">68 g · body half</text>
  <text x="379.429" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A5 Avionics stack</text>
  <text x="379.429" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">8 g · rings round the bore</text>
  <text x="574.857" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A6 Dump stage</text>
  <text x="574.857" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">20 g · chopper shunt</text>
  <text x="770.286" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A7 Buffer</text>
  <text x="770.286" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">54 g · 150–200 J</text>
  <text x="965.714" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A8 Setter coil</text>
  <text x="965.714" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">47 g · inductive set</text>
  <text x="1161.14" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">A9 Fuze train</text>
  <text x="1161.14" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">60 g · det, switch, rotor</text>
  <text x="1356.57" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">F9 · the reservation</text>
  <text x="1356.57" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">Ø30 clear on the axis</text>
  <text x="24" y="255.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">BETWEEN</text>
  <text x="24" y="271.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">the rolling elements</text>
  <text x="184" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">C1 Balls and cage</text>
  <text x="184" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">13 g · the only load path</text>
  <text x="457.6" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Mechanical interface</text>
  <text x="457.6" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">100% of the load, no torque</text>
  <text x="731.2" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Electromagnetic</text>
  <text x="731.2" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">100% of the torque, no load</text>
  <text x="1004.8" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Launch load path</text>
  <text x="1004.8" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">setback misses the bearings</text>
  <text x="1278.4" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Air gap 0.400 mm</text>
  <text x="1278.4" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">0.20 mm max deflection</text>
  <text x="24" y="339.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">RING SIDE</text>
  <text x="24" y="355.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">de-spun, carries fins</text>
  <text x="184" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">B1 Ring carrier</text>
  <text x="184" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">1520 g · one billet</text>
  <text x="379.429" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">B2 Rotor backiron</text>
  <text x="379.429" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">283 g · closes the circuit</text>
  <text x="574.857" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">B3 Magnets</text>
  <text x="574.857" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">74 g · 14 magnets, 7 pairs</text>
  <text x="770.286" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">B4 Outer races</text>
  <text x="770.286" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">90 g · ring half</text>
  <text x="965.714" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">B5 Steering fins</text>
  <text x="965.714" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">296 g · equal cant</text>
  <text x="1161.14" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">B5 Control fins</text>
  <text x="1161.14" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">296 g · opposite cant</text>
  <text x="1356.57" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">C2 Link, ring half</text>
  <text x="1356.57" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">36 g · transformer + light</text>
  <text x="24" y="423.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">MASS</text>
  <text x="24" y="439.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">measured, not budgeted</text>
  <text x="184" y="425.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Kit total, steel</text>
  <text x="184" y="445.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">4.839 kg as modelled</text>
  <text x="457.6" y="425.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Kit total, aluminium</text>
  <text x="457.6" y="445.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">2.713 kg as modelled</text>
  <text x="731.2" y="425.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Machine alone</text>
  <text x="731.2" y="445.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">1.018 kg · +5% over C40</text>
  <text x="1004.8" y="425.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Rotating assembly</text>
  <text x="1004.8" y="445.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">1.876 kg · C26&#x27;s load</text>
  <text x="1278.4" y="425.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Against P9 ≤ 1.4 kg</text>
  <text x="1278.4" y="445.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">+246% steel, +94% alu</text>
</svg>
