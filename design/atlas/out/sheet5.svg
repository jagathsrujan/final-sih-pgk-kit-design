  <text x="22" y="22" font-size="20" text-anchor="start" style="fill:var(--f-ink, #10151b)">Flight timeline and the action → reaction set</text>
  <text x="22" y="42.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">What happens when, what acts on the ring while it happens, and what the design does in response. The bottom lane is what we have not yet demonstrated — it is drawn rather than omitted.</text>
  <text x="24" y="87.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">PHASES</text>
  <text x="24" y="103.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">as the design sees it</text>
  <text x="184" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">In bore</text>
  <text x="184" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">no in-bore function</text>
  <text x="355" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Muzzle exit t = 0</text>
  <text x="355" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">546–943 m/s · 545 kPa</text>
  <text x="526" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Pre-nav 0–15 s</text>
  <text x="526" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">max(arming, converg.)</text>
  <text x="697" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Guided 15–35 s</text>
  <text x="697" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">authority available</text>
  <text x="868" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Inhibited 35–55 s</text>
  <text x="868" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">computed, not planned</text>
  <text x="1039" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Guided 55–86.5 s</text>
  <text x="1039" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">the long segment</text>
  <text x="1210" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Apogee 41.2 s</text>
  <text x="1210" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">Taero floor 0.171 N·m</text>
  <text x="1381" y="89.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Impact 86.5 s</text>
  <text x="1381" y="109.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">Taero 2.12 N·m</text>
  <text x="24" y="171.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">LOADS</text>
  <text x="24" y="187.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">what acts on the ring</text>
  <text x="184" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">276 kN setback</text>
  <text x="184" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">seats past the bearings</text>
  <text x="457.6" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Taero 1.80 → 0.171 N·m</text>
  <text x="457.6" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">launch down to apogee</text>
  <text x="731.2" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Taero 0.171 → 2.12 N·m</text>
  <text x="731.2" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">apogee on to impact</text>
  <text x="1004.8" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Tf ≤ 0.10 N·m</text>
  <text x="1004.8" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">flat over every speed</text>
  <text x="1278.4" y="173.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">F_steer ≥ 18.1 N</text>
  <text x="1278.4" y="193.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">a minimum, not an average</text>
  <text x="24" y="255.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">RESPONSE</text>
  <text x="24" y="271.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">action → reaction</text>
  <text x="184" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Command open</text>
  <text x="184" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">realised by the phasor</text>
  <text x="355" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Authority short</text>
  <text x="355" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">derate to I_avail(ω)</text>
  <text x="526" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Thermal high</text>
  <text x="526" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">derate G15, then trip</text>
  <text x="697" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Mag disturbed</text>
  <text x="697" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">notch + in-flight cal</text>
  <text x="868" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">GNSS lost</text>
  <text x="868" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">INS coast, bounded</text>
  <text x="1039" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">BIT flags a fault</text>
  <text x="1039" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">hold / derate / fuze</text>
  <text x="1210" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">Predicted-miss veto</text>
  <text x="1210" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">&gt;150 m → latch, dud</text>
  <text x="1381" y="257.2" font-size="14" text-anchor="start" style="fill:var(--f-accent, #0b5cad)">No setback</text>
  <text x="1381" y="277.4" font-size="13" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">safe, no abort logic</text>
  <text x="24" y="339.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">DECLARED OPEN</text>
  <text x="24" y="355.6" font-size="12" text-anchor="start" style="fill:var(--f-ink3, #7b8794)">not yet demonstrated</text>
  <text x="184" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Friction at flight speed</text>
  <text x="184" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">C13 · rig parameter only</text>
  <text x="457.6" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Thermal joint at speed</text>
  <text x="457.6" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">P6 · ≥58 W/K by test</text>
  <text x="731.2" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Coexistence at speed</text>
  <text x="731.2" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">F15 · rig run required</text>
  <text x="1004.8" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Ring-body link</text>
  <text x="1004.8" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">H7 · 4.0 mm working gap</text>
  <text x="1278.4" y="341.2" font-size="14" text-anchor="start" style="fill:var(--f-ink2, #46525f)">Buffer under launch</text>
  <text x="1278.4" y="361.4" font-size="13" text-anchor="start" style="fill:var(--f-flag, #a4551a)">W4 · setback pulse</text>
</svg>
