<text x="76" y="268" text-anchor="start" style="font-size:8.5px;fill:var(--f-ink3, #7b8794);font-weight:400">Left: published unguided CEP for this class of shell — our own numbers replace these once we have the drawing.   Right: rounds for a 90 % chance against a point target.</text>
